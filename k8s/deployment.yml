apiVersion: apps/v1
kind: Deployment
metadata:
  name: pueblo-fe
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pueblo-fe
  template:
    metadata:
      labels:
        app: pueblo-fe
    spec:
      containers:
        - name: pueblo-fe
          # CI replaces this placeholder with the successfully published commit tag.
          image: ghcr.io/team-pueblo/pueblo-fe:sha-104b0f90bd3c1d8f959047954725999277cf1f68
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pueblo-fe-config
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: pueblo-fe
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: pueblo-fe
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
